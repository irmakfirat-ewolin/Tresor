<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tresor</title>
<style>
  :root{
    --bg: #EDE8DE;
    --paper: #FBF9F4;
    --ink: #2A241C;
    --ink-soft: #7A7263;
    --line: #DAD2C0;
    --shadow: 0 2px 10px rgba(42,36,28,0.08);
    --radius: 10px;
    --c-ausweise: #A8412C;
    --c-bankomat: #2E6B4F;
    --c-personen: #4A5A8C;
  }
  *{box-sizing:border-box;}
  html, body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
    margin:0;
    padding:0;
  }
  body{
    font-family: 'Iowan Old Style','Georgia',serif;
    background: var(--bg);
    color: var(--ink);
    min-height:100vh;
  }
  .ui{ font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }

  /* ---------- LOGIN ---------- */
  #login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:22px;
    padding:24px;
  }
  #login .lock{
    width:52px;height:52px;border-radius:50%;
    background: var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:var(--paper);
  }
  #login h1{
    font-size:22px;font-weight:600;margin:0;letter-spacing:.2px;
  }
  #login p{ margin:0; color:var(--ink-soft); font-size:14px; }
  .login-form{ display:flex; flex-direction:column; gap:12px; width:min(300px,80vw); }
  .login-form input{
    height:46px; padding:0 14px;
    font-size:15px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, sans-serif;
  }
  .login-form input:focus{ outline:none; border-color: var(--ink); }
  .login-form button{
    height:46px; border:none; border-radius:8px;
    background: var(--ink); color: var(--paper);
    font-family: -apple-system, sans-serif;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .login-form button:disabled{ opacity:.6; }
  #loginError{ color:#A8412C; font-size:13px; height:16px; font-family:-apple-system,sans-serif; }

  /* ---------- APP SHELL ---------- */
  #app{ display:none; min-height:100vh; }
  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px 0 20px;
  }
  header.topbar h1{
    font-size:19px; margin:0; font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  header.topbar .lockbtn{
    font-family:-apple-system,sans-serif;
    font-size:12px; color:var(--ink-soft);
    background:none;border:1px solid var(--line);
    padding:6px 12px; border-radius:20px; cursor:pointer;
  }

  /* folder tabs */
  .tabs{
    display:flex; flex-wrap:wrap; gap:6px;
    padding: 18px 16px 0 16px;
  }
  .tab{
    font-family:-apple-system,sans-serif;
    font-size:13.5px; font-weight:600;
    padding:11px 8px 13px 8px;
    border-radius: 10px 10px 4px 4px;
    cursor:pointer;
    color: var(--paper);
    opacity:.55;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition: opacity .15s ease, transform .15s ease;
    flex: 1 1 calc(33.333% - 4px);
    min-width:0;
    max-width:calc(33.333% - 4px);
  }
  .tab span:last-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab:hover{ opacity:.8; }
  .tab.active{ opacity:1; transform: translateY(-2px); }

  .folder-body{
    background: var(--paper);
    margin: 0 16px 24px 16px;
    border-radius: 0 10px 10px 10px;
    box-shadow: var(--shadow);
    min-height: 60vh;
    padding: 22px;
  }

  /* subcategory pills */
  .subcats{
    display:flex; gap:8px; flex-wrap:wrap;
    margin-bottom: 22px;
    font-family:-apple-system,sans-serif;
  }
  .subcat-pill{
    font-size:13px; font-weight:600;
    padding:7px 15px; border-radius:20px;
    border:1.5px solid var(--line);
    background: var(--bg);
    cursor:pointer; color: var(--ink-soft);
  }
  .subcat-pill.active{
    color:#fff; border-color: transparent;
  }

  .section-title{
    font-family:-apple-system,sans-serif;
    font-size:12.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.6px;
    color:var(--ink-soft);
    margin: 26px 0 10px 0;
  }
  .section-title:first-child{ margin-top:0; }

  /* file group cards */
  .filegroups{ display:grid; grid-template-columns:1fr; gap:12px; }
  @media(min-width:640px){ .filegroups{ grid-template-columns:1fr 1fr; } }
  .filegroup{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:14px 14px 12px 14px;
    background:#fff;
    font-family:-apple-system,sans-serif;
  }
  .filegroup h4{
    margin:0 0 10px 0; font-size:13.5px; font-weight:700;
  }
  .file-chip{
    display:flex; align-items:center; gap:8px;
    padding:7px 10px; margin-bottom:6px;
    border-radius:7px;
    font-size:13px; font-weight:600;
    background: color-mix(in srgb, var(--accent) 12%, white);
    color: var(--accent);
  }
  .file-chip a{ color:inherit; text-decoration:none; flex:1; word-break:break-all; }
  .file-chip button{
    border:none; background:none; cursor:pointer;
    color: var(--ink-soft); font-size:15px; line-height:1;
    padding:2px 4px;
  }
  .file-chip button:hover{ color:#A8412C; }
  .addfile-btn{
    font-size:12.5px; font-weight:700;
    border:1.5px dashed var(--line);
    background:none; border-radius:7px;
    padding:7px 10px; width:100%; cursor:pointer;
    color: var(--ink-soft); margin-top:2px;
  }
  .addfile-btn:hover{ border-color: var(--accent); color:var(--accent); }

  /* text fields */
  .textfields{ display:grid; grid-template-columns:1fr; gap:14px; max-width:420px; }
  @media(min-width:640px){ .textfields{ grid-template-columns:1fr 1fr; } }
  .tf{ display:flex; flex-direction:column; gap:5px; font-family:-apple-system,sans-serif; }
  .tf label{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  .tf input{
    border:1.5px solid var(--line); border-radius:7px;
    padding:9px 11px; font-size:14.5px; font-weight:700;
    background:#fff;
  }
  .tf input:focus{ outline:none; border-color: var(--accent); }
  .tf .saved-hint{ font-size:11px; color:var(--accent); height:13px; opacity:0; transition:opacity .3s; }
  .tf .saved-hint.show{ opacity:1; }

  .add-custom-group{
    font-family:-apple-system,sans-serif;
    margin-top:16px; font-size:13px; font-weight:700;
    background:none; border:1.5px solid var(--line); border-radius:8px;
    padding:9px 14px; cursor:pointer; color:var(--ink-soft);
  }
  .add-custom-group:hover{ color:var(--accent); border-color:var(--accent); }

  /* id document cards (Ausweise) */
  .iddoc-grid{ display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:14px; }
  @media(min-width:640px){ .iddoc-grid{ grid-template-columns:1fr 1fr; } }
  .iddoc-card{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:14px;
    background:#fff;
    font-family:-apple-system,sans-serif;
  }
  .iddoc-fields{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin-top:12px;
  }
  .iddoc-fields .tf label{ font-size:11px; }
  .iddoc-fields .tf input{
    border:1.5px solid var(--line); border-radius:7px;
    padding:7px 9px; font-size:13.5px; font-weight:700;
    background:var(--bg);
  }
  .iddoc-fields .tf input:focus{ outline:none; border-color: var(--accent); }

  .tf-copy-row{ display:flex; gap:6px; align-items:stretch; }
  .tf-copy-row input{ flex:1; min-width:0; }
  .copy-btn{
    flex-shrink:0;
    width:34px;
    border:1.5px solid var(--line); border-radius:7px;
    background: var(--bg); color: var(--accent);
    font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .copy-btn:hover{ border-color: var(--accent); }
  .copy-btn:active{ transform: scale(0.94); }

  .hint{
    font-family:-apple-system,sans-serif; font-size:12.5px; color:var(--ink-soft);
    margin-top:2px; margin-bottom:18px;
  }

  #toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background: var(--ink); color:#fff; padding:10px 18px; border-radius:20px;
    font-family:-apple-system,sans-serif; font-size:13px; font-weight:600;
    opacity:0; pointer-events:none; transition: all .25s ease;
    z-index:100;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login" class="ui">
  <div class="lock">🔒</div>
  <h1>Tresor</h1>
  <p>Anmelden, um fortzufahren</p>
  <div class="login-form">
    <input type="email" id="loginEmail" placeholder="E-Mail-Adresse" autocomplete="username" />
    <input type="password" id="loginPassword" placeholder="Passwort" autocomplete="current-password" />
    <button id="loginBtn">Anmelden</button>
  </div>
  <div id="loginError"></div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <header class="topbar ui">
    <h1>🔒 Tresor</h1>
    <button class="lockbtn" id="lockBtn">Sperren</button>
  </header>

  <div class="tabs ui" id="tabs"></div>
  <div class="folder-body" id="folderBody"></div>
</div>

<div id="toast" class="ui"></div>

<script type="module">
/* =========================================================
   1) FIREBASE-KONFIGURATION — HIER AUSFÜLLEN
   Firebase Console -> Projekteinstellungen -> "Allgemein" ->
   "Meine Apps" -> SDK-Setup und Konfiguration -> Werte kopieren.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBZUgoJIh2flCdR4lNU8q4VxeB4G-St2Y0",
  authDomain: "schulwegend.firebaseapp.com",
  projectId: "schulwegend",
  storageBucket: "schulwegend.firebasestorage.app",
  messagingSenderId: "662513011948",
  appId: "1:662513011948:web:9d53610f616e9f882769c9"
};

/* =========================================================
   2) KATEGORIEN-KONFIGURATION
   Neue Karteikarten später einfach hier als weiteres Objekt
   im "categories"-Array ergänzen — der Rest der App baut sich
   automatisch danach auf.
   ========================================================= */
const CONFIG = {
  categories: [
    {
      id: "ausweise",
      label: "Ausweise",
      icon: "🪪",
      color: "var(--c-ausweise)",
      subcategories: ["Firat", "Ebru", "Eflin"],
      type: "idDocuments"
    },
    {
      id: "bankomatkarten",
      label: "Bankomatkarten",
      icon: "💳",
      color: "var(--c-bankomat)",
      subcategories: ["Österreich", "Türkei"],
      type: "cards"
    },
    {
      id: "personendokumente",
      label: "Dokumente von Personen",
      icon: "📄",
      color: "var(--c-personen)",
      subcategories: ["Firat", "Ebru", "Sevgi"],
      fileGroups: ["Staatsbürgerschaftsnachweis", "Meldezettel", "Geburtsurkunde", "Heiratsurkunde"],
      textFields: [],
      allowCustomGroups: true
    }
  ]
};

/* =========================================================
   FIREBASE INIT
   ========================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL, deleteObject
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const storage = getStorage(fbApp, "gs://tresor-storage");
const auth = getAuth(fbApp);

/* =========================================================
   LOGIN (Firebase Authentication)
   ========================================================= */
const loginBtn = document.getElementById('loginBtn');
const emailInput = document.getElementById('loginEmail');
const passwordInput = document.getElementById('loginPassword');
const errorEl = document.getElementById('loginError');

async function doLogin(){
  errorEl.textContent = '';
  loginBtn.disabled = true;
  loginBtn.textContent = 'Anmelden…';
  try {
    await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
  } catch(e){
    errorEl.textContent = 'E-Mail oder Passwort falsch.';
  }
  loginBtn.disabled = false;
  loginBtn.textContent = 'Anmelden';
}

loginBtn.addEventListener('click', doLogin);
passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

document.getElementById('lockBtn').addEventListener('click', () => {
  signOut(auth);
});

onAuthStateChanged(auth, (user) => {
  if (user){
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    boot();
  } else {
    document.getElementById('login').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

/* =========================================================
   APP LOGIC
   ========================================================= */
let activeCategoryId = CONFIG.categories[0].id;
let activeSubcatByCategory = {};
CONFIG.categories.forEach(c => activeSubcatByCategory[c.id] = c.subcategories[0]);

function boot(){
  renderTabs();
  renderFolderBody();
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  CONFIG.categories.forEach(cat => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (cat.id === activeCategoryId ? ' active' : '');
    tab.style.background = cat.color;
    tab.innerHTML = `<span>${cat.icon}</span><span>${cat.label}</span>`;
    tab.addEventListener('click', () => {
      activeCategoryId = cat.id;
      renderTabs();
      renderFolderBody();
    });
    tabsEl.appendChild(tab);
  });
}

function currentCategory(){
  return CONFIG.categories.find(c => c.id === activeCategoryId);
}

function docId(cat, subcat){
  return `${cat.id}__${sanitizeKey(subcat)}`;
}

function sanitizeKey(s){
  return s.toString().trim().replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, '_');
}

async function loadEntry(cat, subcat){
  const ref_ = doc(db, 'tresor_data', docId(cat, subcat));
  const snap = await getDoc(ref_);
  if (snap.exists()) return snap.data();
  return { textFields: {}, fileGroups: {}, customGroups: [] };
}

async function saveEntry(cat, subcat, data){
  const ref_ = doc(db, 'tresor_data', docId(cat, subcat));
  await setDoc(ref_, data, { merge: true });
}

async function renderFolderBody(){
  const cat = currentCategory();
  const body = document.getElementById('folderBody');
  body.style.setProperty('--accent', cat.color.startsWith('var') ? getComputedStyle(document.documentElement).getPropertyValue(cat.color.slice(4,-1)) : cat.color);
  body.innerHTML = `<div class="ui" id="bodyInner">Lädt…</div>`;

  const subcat = activeSubcatByCategory[cat.id];
  const entry = await loadEntry(cat, subcat);

  const wrap = document.createElement('div');
  wrap.className = 'ui';

  // subcategory pills
  const subcatsEl = document.createElement('div');
  subcatsEl.className = 'subcats';
  cat.subcategories.forEach(sc => {
    const pill = document.createElement('div');
    pill.className = 'subcat-pill' + (sc === subcat ? ' active' : '');
    pill.textContent = sc;
    if (sc === subcat) pill.style.background = accentColor(cat);
    pill.addEventListener('click', () => {
      activeSubcatByCategory[cat.id] = sc;
      renderFolderBody();
    });
    subcatsEl.appendChild(pill);
  });
  wrap.appendChild(subcatsEl);

  if (cat.type === "idDocuments"){
    wrap.appendChild(renderIdDocuments(cat, subcat, entry.idDocuments || []));
    body.innerHTML = '';
    body.appendChild(wrap);
    return;
  }

  if (cat.type === "cards"){
    wrap.appendChild(renderCards(cat, subcat, entry.cards || []));
    body.innerHTML = '';
    body.appendChild(wrap);
    return;
  }

  // file groups
  wrap.appendChild(sectionTitle('Dokumente'));
  const groupsEl = document.createElement('div');
  groupsEl.className = 'filegroups';

  const allGroups = [...cat.fileGroups, ...(entry.customGroups || [])];
  allGroups.forEach(groupName => {
    groupsEl.appendChild(renderFileGroup(cat, subcat, groupName, entry.fileGroups?.[sanitizeKey(groupName)] || []));
  });
  wrap.appendChild(groupsEl);

  if (cat.allowCustomGroups){
    const addBtn = document.createElement('button');
    addBtn.className = 'add-custom-group';
    addBtn.textContent = '+ weiteres Dokument hinzufügen';
    addBtn.addEventListener('click', async () => {
      const name = prompt('Name des neuen Dokuments (z. B. "Scheidungsurteil"):');
      if (!name) return;
      const updated = entry.customGroups ? [...entry.customGroups, name] : [name];
      await saveEntry(cat, subcat, { customGroups: updated });
      renderFolderBody();
    });
    wrap.appendChild(addBtn);
  }

  // text fields
  if (cat.textFields.length){
    wrap.appendChild(sectionTitle('Angaben'));
    const tfWrap = document.createElement('div');
    tfWrap.className = 'textfields';
    cat.textFields.forEach(f => {
      tfWrap.appendChild(renderTextField(cat, subcat, f, entry.textFields?.[f.key] || ''));
    });
    wrap.appendChild(tfWrap);
  }

  body.innerHTML = '';
  body.appendChild(wrap);
}

function accentColor(cat){
  if (cat.color.startsWith('var(')){
    return getComputedStyle(document.documentElement).getPropertyValue(cat.color.slice(4,-1)).trim();
  }
  return cat.color;
}

function sectionTitle(text){
  const t = document.createElement('div');
  t.className = 'section-title';
  t.textContent = text;
  return t;
}

const expandedCardIds = new Set();

const CARD_FIELDS = [
  { key: "kartenname", label: "Name der Karte (z. B. Visa, Revolut)" },
  { key: "kartennummer", label: "Kartennummer" },
  { key: "ablaufdatum", label: "Ablaufdatum" },
  { key: "inhaber", label: "Name auf der Karte" },
  { key: "cvc", label: "Sicherheitscode (CVC)" }
];

function renderCards(cat, subcat, cards){
  const wrap = document.createElement('div');
  wrap.className = 'ui';
  wrap.style.setProperty('--accent', accentColor(cat));

  const grid = document.createElement('div');
  grid.className = 'card-grid';
  cards.forEach(c => grid.appendChild(renderCardItem(cat, subcat, c)));
  wrap.appendChild(grid);

  const addBtn = document.createElement('button');
  addBtn.className = 'add-custom-group';
  addBtn.textContent = '+ Karte hinzufügen';

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.jpg,.jpeg,.png,.pdf';
  fileInput.style.display = 'none';

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    addBtn.textContent = 'Lädt hoch…';
    addBtn.disabled = true;
    try {
      const path = `tresor/${cat.id}/${sanitizeKey(subcat)}/${Date.now()}_${sanitizeKey(file.name)}`;
      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, file);
      const url = await getDownloadURL(storageRef);
      const entry = await loadEntry(cat, subcat);
      const list = entry.cards || [];
      const newId = uid();
      list.push({ id: newId, url, path, kartenname: '', kartennummer: '', ablaufdatum: '', inhaber: '', cvc: '' });
      await saveEntry(cat, subcat, { cards: list });
      expandedCardIds.add(newId);
      showToast('Karte hochgeladen');
      renderFolderBody();
    } catch(e){
      console.error(e);
      alert('Upload fehlgeschlagen: ' + e.message);
      addBtn.textContent = '+ Karte hinzufügen';
      addBtn.disabled = false;
    }
  });

  addBtn.addEventListener('click', () => fileInput.click());
  wrap.appendChild(fileInput);
  wrap.appendChild(addBtn);

  return wrap;
}

function renderCardItem(cat, subcat, c){
  const card = document.createElement('div');
  card.className = 'card-item';
  card.style.setProperty('--accent', accentColor(cat));

  const header = document.createElement('div');
  header.className = 'card-item-header';

  const thumbLink = document.createElement('a');
  thumbLink.href = c.url;
  thumbLink.target = '_blank';
  thumbLink.rel = 'noopener';
  thumbLink.className = 'card-thumb-link';
  thumbLink.addEventListener('click', (e) => e.stopPropagation());
  const img = document.createElement('img');
  img.className = 'card-thumb';
  img.src = c.url;
  img.alt = 'Kartenfoto';
  img.onerror = () => { img.style.display = 'none'; thumbLink.textContent = '📎 Datei öffnen'; };
  thumbLink.appendChild(img);
  header.appendChild(thumbLink);

  const titleWrap = document.createElement('div');
  titleWrap.className = 'card-item-title';
  const isExpanded = expandedCardIds.has(c.id);
  titleWrap.innerHTML = `<span>${escapeHtml(c.kartenname || 'Karte')}</span><span class="chev">${isExpanded ? '▲' : '▼'}</span>`;
  header.appendChild(titleWrap);

  const delBtn = document.createElement('button');
  delBtn.className = 'card-del-btn';
  delBtn.textContent = '✕';
  delBtn.title = 'Löschen';
  delBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('Diese Karte wirklich löschen?')) return;
    try { await deleteObject(ref(storage, c.path)); } catch(err){ console.warn(err); }
    const entry = await loadEntry(cat, subcat);
    const list = (entry.cards || []).filter(x => x.id !== c.id);
    await saveEntry(cat, subcat, { cards: list });
    renderFolderBody();
    showToast('Karte gelöscht');
  });
  header.appendChild(delBtn);

  header.addEventListener('click', () => {
    if (expandedCardIds.has(c.id)) expandedCardIds.delete(c.id);
    else expandedCardIds.add(c.id);
    renderFolderBody();
  });

  card.appendChild(header);

  if (isExpanded){
    const fieldsWrap = document.createElement('div');
    fieldsWrap.className = 'card-fields';
    CARD_FIELDS.forEach(f => {
      fieldsWrap.appendChild(renderCardField(cat, subcat, c, f.key, f.label));
    });
    card.appendChild(fieldsWrap);
  }

  return card;
}

function renderCardField(cat, subcat, c, key, label){
  const wrap = document.createElement('div');
  wrap.className = 'tf';
  const labelEl = document.createElement('label');
  labelEl.textContent = label;

  const inputRow = document.createElement('div');
  inputRow.className = 'tf-copy-row';

  const input = document.createElement('input');
  input.type = 'text';
  input.value = c[key] || '';
  input.style.color = accentColor(cat);

  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'copy-btn';
  copyBtn.title = 'Kopieren';
  copyBtn.textContent = '⧉';
  copyBtn.addEventListener('click', async () => {
    if (!input.value) return;
    try { await navigator.clipboard.writeText(input.value); showToast('Kopiert'); }
    catch(e){ input.select(); document.execCommand('copy'); showToast('Kopiert'); }
  });

  inputRow.appendChild(input);
  inputRow.appendChild(copyBtn);

  const hint = document.createElement('div');
  hint.className = 'saved-hint';
  hint.textContent = 'Gespeichert ✓';

  let debounce;
  input.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(async () => {
      const entry = await loadEntry(cat, subcat);
      const list = entry.cards || [];
      const idx = list.findIndex(x => x.id === c.id);
      if (idx > -1){
        list[idx] = { ...list[idx], [key]: input.value };
        await saveEntry(cat, subcat, { cards: list });
        hint.classList.add('show');
        setTimeout(() => hint.classList.remove('show'), 1200);
      }
    }, 600);
  });

  wrap.appendChild(labelEl);
  wrap.appendChild(inputRow);
  wrap.appendChild(hint);
  return wrap;
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function renderIdDocuments(cat, subcat, docs){
  const wrap = document.createElement('div');
  wrap.className = 'ui';
  wrap.style.setProperty('--accent', accentColor(cat));

  const grid = document.createElement('div');
  grid.className = 'iddoc-grid';

  docs.forEach(d => {
    grid.appendChild(renderIdDocCard(cat, subcat, d));
  });
  wrap.appendChild(grid);

  const addBtn = document.createElement('button');
  addBtn.className = 'add-custom-group';
  addBtn.textContent = '+ Ausweis hinzufügen';

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.pdf,.jpg,.jpeg,.png';
  fileInput.style.display = 'none';

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const suggested = file.name.replace(/\.[^/.]+$/, '');
    const displayName = prompt('Anzeigename für diesen Ausweis (z. B. "Reisepass"):', suggested);
    if (displayName === null) return;
    addBtn.textContent = 'Lädt hoch…';
    addBtn.disabled = true;
    try {
      const path = `tresor/${cat.id}/${sanitizeKey(subcat)}/${Date.now()}_${sanitizeKey(file.name)}`;
      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, file);
      const url = await getDownloadURL(storageRef);
      const entry = await loadEntry(cat, subcat);
      const list = entry.idDocuments || [];
      list.push({ id: uid(), name: displayName || file.name, url, path, ausweisnummer: '', ablaufdatum: '' });
      await saveEntry(cat, subcat, { idDocuments: list });
      showToast('Ausweis hochgeladen');
      renderFolderBody();
    } catch(e){
      console.error(e);
      alert('Upload fehlgeschlagen: ' + e.message);
      addBtn.textContent = '+ Ausweis hinzufügen';
      addBtn.disabled = false;
    }
  });

  addBtn.addEventListener('click', () => fileInput.click());
  wrap.appendChild(fileInput);
  wrap.appendChild(addBtn);

  return wrap;
}

function renderIdDocCard(cat, subcat, docEntry){
  const card = document.createElement('div');
  card.className = 'iddoc-card';
  card.style.setProperty('--accent', accentColor(cat));

  const chip = document.createElement('div');
  chip.className = 'file-chip';
  chip.innerHTML = `<a href="${docEntry.url}" target="_blank" rel="noopener">📎 ${escapeHtml(docEntry.name)}</a>`;
  const delBtn = document.createElement('button');
  delBtn.textContent = '✕';
  delBtn.title = 'Löschen';
  delBtn.addEventListener('click', async () => {
    if (!confirm(`"${docEntry.name}" wirklich löschen?`)) return;
    try { await deleteObject(ref(storage, docEntry.path)); } catch(e){ console.warn(e); }
    const entry = await loadEntry(cat, subcat);
    const list = (entry.idDocuments || []).filter(d => d.id !== docEntry.id);
    await saveEntry(cat, subcat, { idDocuments: list });
    renderFolderBody();
    showToast('Ausweis gelöscht');
  });
  chip.appendChild(delBtn);
  card.appendChild(chip);

  const fieldsRow = document.createElement('div');
  fieldsRow.className = 'iddoc-fields';
  fieldsRow.appendChild(renderIdField(cat, subcat, docEntry, 'ausweisnummer', 'Ausweisnummer'));
  fieldsRow.appendChild(renderIdField(cat, subcat, docEntry, 'ablaufdatum', 'Ablaufdatum'));
  card.appendChild(fieldsRow);

  return card;
}

function renderIdField(cat, subcat, docEntry, key, label){
  const wrap = document.createElement('div');
  wrap.className = 'tf';
  const labelEl = document.createElement('label');
  labelEl.textContent = label;

  const inputRow = document.createElement('div');

  const input = document.createElement('input');

  input.style.color = accentColor(cat);

  const copyBtn = document.createElement('button');

  copyBtn.title = 'Kopieren';
  copyBtn.textContent = '⧉';

    if (!input.value) return;

      await navigator.clipboard.writeText(input.value);

function renderFileGroup(cat, subcat, groupName, files){
  const box = document.createElement('div');
  box.className = 'filegroup';
  box.style.setProperty('--accent', accentColor(cat));

  const h4 = document.createElement('h4');
  h4.textContent = groupName;
  box.appendChild(h4);

  files.forEach((f, idx) => {
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    chip.innerHTML = `<a href="${f.url}" target="_blank" rel="noopener">📎 ${escapeHtml(f.name)}</a>`;
    const delBtn = document.createElement('button');
    delBtn.textContent = '✕';
    delBtn.title = 'Löschen';
    delBtn.addEventListener('click', async () => {
      if (!confirm(`"${f.name}" wirklich löschen?`)) return;
      try { await deleteObject(ref(storage, f.path)); } catch(e){ console.warn(e); }
      const entry = await loadEntry(cat, subcat);
      const key = sanitizeKey(groupName);
      const list = entry.fileGroups?.[key] || [];
      list.splice(idx, 1);
      await saveEntry(cat, subcat, { fileGroups: { ...entry.fileGroups, [key]: list } });
      renderFolderBody();
      showToast('Datei gelöscht');
    });
    chip.appendChild(delBtn);
    box.appendChild(chip);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'addfile-btn';
  addBtn.textContent = '+ Datei hochladen (PDF/JPG)';
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.pdf,.jpg,.jpeg,.png';
  fileInput.style.display = 'none';

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const suggested = file.name.replace(/\.[^/.]+$/, '');
    const displayName = prompt('Anzeigename für diese Datei:', suggested);
    if (displayName === null) return;
    addBtn.textContent = 'Lädt hoch…';
    addBtn.disabled = true;
    try {
      const path = `tresor/${cat.id}/${sanitizeKey(subcat)}/${sanitizeKey(groupName)}/${Date.now()}_${sanitizeKey(file.name)}`;
      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, file);
      const url = await getDownloadURL(storageRef);
      const entry = await loadEntry(cat, subcat);
      const key = sanitizeKey(groupName);
      const list = entry.fileGroups?.[key] || [];
      list.push({ name: displayName || file.name, url, path });
      await saveEntry(cat, subcat, { fileGroups: { ...entry.fileGroups, [key]: list } });
      showToast('Datei hochgeladen');
      renderFolderBody();
    } catch(e){
      console.error(e);
      alert('Upload fehlgeschlagen: ' + e.message);
      addBtn.textContent = '+ Datei hochladen (PDF/JPG)';
      addBtn.disabled = false;
    }
  });

  addBtn.addEventListener('click', () => fileInput.click());
  box.appendChild(fileInput);
  box.appendChild(addBtn);

  return box;
}

function renderTextField(cat, subcat, field, value){
  const wrap = document.createElement('div');
  wrap.className = 'tf';
  const label = document.createElement('label');
  label.textContent = field.label;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = value;
  input.style.color = accentColor(cat);
  input.style.setProperty('--accent', accentColor(cat));
  const hint = document.createElement('div');
  hint.className = 'saved-hint';
  hint.textContent = 'Gespeichert ✓';

  let debounce;
  input.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(async () => {
      const entry = await loadEntry(cat, subcat);
      await saveEntry(cat, subcat, { textFields: { ...entry.textFields, [field.key]: input.value } });
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 1200);
    }, 600);
  });

  wrap.appendChild(label);
  wrap.appendChild(input);
  wrap.appendChild(hint);
  return wrap;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
</script>
